name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0 or 1.0.0)'
        required: true
        type: string
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha

jobs:
  # 创建 Git 标签（根据类型自动补全后缀）
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version_name: ${{ steps.tag.outputs.version_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize version and tag
        id: tag
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          TYPE="${{ github.event.inputs.release_type }}"
          # 移除版本号开头的 'v' 如果存在
          VERSION="${RAW_VERSION#v}"
          # 根据类型决定标签和预发布标志
          case "$TYPE" in
            release)
              # release 版本必须不包含 alpha/beta 等后缀
              if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
                echo "Error: release version must not contain alpha/beta/rc suffixes." >&2
                exit 1
              fi
              TAG="v$VERSION"
              PRERELEASE="false"
              ;;
            beta)
              # beta 版本必须包含 beta 或自动添加 -beta
              if [[ ! "$VERSION" =~ beta ]]; then
                VERSION="${VERSION}-beta"
              fi
              TAG="v$VERSION"
              PRERELEASE="true"
              ;;
            alpha)
              if [[ ! "$VERSION" =~ alpha ]]; then
                VERSION="${VERSION}-alpha"
              fi
              TAG="v$VERSION"
              PRERELEASE="true"
              ;;
          esac
          # 检查标签是否已存在
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, will reuse it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT

  # 生成变更日志
  generate-changelog:
    runs-on: ubuntu-latest
    needs: create-tag
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个标签（如果存在）
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG="${{ needs.create-tag.outputs.tag_name }}"
          if [ -z "$PREV_TAG" ]; then
            # 首次发布，列出所有提交
            LOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            LOG=$(git log "$PREV_TAG..$CURRENT_TAG" --pretty=format:"- %s (%h)" --reverse)
          fi
          # 转义多行内容以便在 GitHub Actions 中输出
          LOG="${LOG//'%'/'%25'}"
          LOG="${LOG//$'\n'/'%0A'}"
          LOG="${LOG//$'\r'/'%0D'}"
          echo "changelog=$LOG" >> $GITHUB_OUTPUT

  # 创建 GitHub Release（草稿，但可根据类型设置预发布）
  create-release:
    runs-on: ubuntu-latest
    needs: [create-tag, generate-changelog]
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-tag.outputs.tag_name }}
          name: ${{ needs.create-tag.outputs.tag_name }}
          body: |
            ## Changelog
            ${{ needs.generate-changelog.outputs.changelog }}
          draft: true
          prerelease: ${{ needs.create-tag.outputs.prerelease }}
          # 可选：让 GitHub 自动生成 Release Notes，与 body 合并
          # generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux 构建（仅自包含）
  build-linux:
    runs-on: ubuntu-latest
    needs: [create-release, create-tag]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version for Debian package
        run: |
          VERSION="${{ needs.create-tag.outputs.version_name }}"
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            echo "Error: Debian package version must start with a digit. Provided version: $VERSION"
            exit 1
          fi
          echo "Version $VERSION is valid for Debian."
      - name: Install appimagetool
        run: |
          wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
      - name: Publish self-contained (Linux)
        run: |
          dotnet publish Clandom/Clandom.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o publish/linux-x64/self-contained
      - name: Build .deb package
        run: |
          VERSION="${{ needs.create-tag.outputs.version_name }}"
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/usr/local/bin
          cp -r publish/linux-x64/self-contained/* deb_package/usr/local/bin/
          printf "Package: clandom\n" > deb_package/DEBIAN/control
          printf "Version: $VERSION\n" >> deb_package/DEBIAN/control
          printf "Section: utils\n" >> deb_package/DEBIAN/control
          printf "Priority: optional\n" >> deb_package/DEBIAN/control
          printf "Architecture: amd64\n" >> deb_package/DEBIAN/control
          printf "Maintainer: Ivan <2917822657@qq.com>\n" >> deb_package/DEBIAN/control
          printf "Description: Clandom - Avalonia Application\n" >> deb_package/DEBIAN/control
          printf " Clandom is a cross-platform application built with Avalonia.\n" >> deb_package/DEBIAN/control
          dpkg-deb --build deb_package ./Clandom-$VERSION-Linux-x64.deb
          rm -rf deb_package
      - name: Build AppImage package
        run: |
          VERSION="${{ needs.create-tag.outputs.version_name }}"
          appdir="AppDir"
          mkdir -p $appdir/usr/bin
          cp -r publish/linux-x64/self-contained/* $appdir/usr/bin/
          printf '[Desktop Entry]\nName=Clandom\nComment=Avalonia Application\nExec=Clandom\nIcon=Clandom\nTerminal=false\nType=Application\nCategories=Utility;\n' > $appdir/Clandom.desktop
          printf '#!/bin/bash\nSELF=$(readlink -f "$0")\nHERE=$(dirname "$SELF")\nexec "$HERE/usr/bin/Clandom" "$@"\n' > $appdir/AppRun
          chmod +x $appdir/AppRun
          appimagetool $appdir Clandom-$VERSION-Linux-x64.AppImage
          rm -rf $appdir
      - name: Upload .deb
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-${{ needs.create-tag.outputs.version_name }}-Linux-x64.deb
          asset_name: Clandom-${{ needs.create-tag.outputs.version_name }}-Linux-x64.deb
          asset_content_type: application/vnd.debian.binary-package
      - name: Upload .AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-${{ needs.create-tag.outputs.version_name }}-Linux-x64.AppImage
          asset_name: Clandom-${{ needs.create-tag.outputs.version_name }}-Linux-x64.AppImage
          asset_content_type: application/x-executable

  # macOS 构建（两种模式）
  build-macos:
    runs-on: macos-latest
    needs: [create-release, create-tag]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained (macOS)
        run: |
          dotnet publish Clandom/Clandom.csproj \
            -c Release -r osx-x64 --self-contained true \
            -o publish/osx-x64/self-contained
      - name: Publish framework-dependent (macOS)
        run: |
          dotnet publish Clandom/Clandom.csproj \
            -c Release -r osx-x64 --self-contained false \
            -o publish/osx-x64/framework-dependent
      - name: Build .pkg packages
        run: |
          VERSION="${{ needs.create-tag.outputs.version_name }}"
          build_pkg() {
            local source_dir=$1
            local output_name=$2
            local app_name="Clandom.app"
            mkdir -p $app_name/Contents/MacOS
            cp -r $source_dir/* $app_name/Contents/MacOS/
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleExecutable</key>\n    <string>Clandom</string>\n    <key>CFBundleIdentifier</key>\n    <string>com.yourcompany.clandom</string>\n    <key>CFBundleName</key>\n    <string>Clandom</string>\n    <key>CFBundleVersion</key>\n    <string>1.0</string>\n</dict>\n</plist>\n' > $app_name/Contents/Info.plist
            pkgbuild --root $app_name --identifier com.yourcompany.clandom --version 1.0 $output_name
            rm -rf $app_name
          }
          build_pkg "publish/osx-x64/self-contained" "Clandom-${VERSION}-macOS-x64-SelfContained.pkg"
          build_pkg "publish/osx-x64/framework-dependent" "Clandom-${VERSION}-macOS-x64-FrameworkDependent.pkg"
      - name: Upload .pkg (self-contained)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-${{ needs.create-tag.outputs.version_name }}-macOS-x64-SelfContained.pkg
          asset_name: Clandom-${{ needs.create-tag.outputs.version_name }}-macOS-x64-SelfContained.pkg
          asset_content_type: application/x-newton-compatible-pkg
      - name: Upload .pkg (framework-dependent)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-${{ needs.create-tag.outputs.version_name }}-macOS-x64-FrameworkDependent.pkg
          asset_name: Clandom-${{ needs.create-tag.outputs.version_name }}-macOS-x64-FrameworkDependent.pkg
          asset_content_type: application/x-newton-compatible-pkg

  # Windows 构建（自包含 ZIP）
  build-windows:
    runs-on: windows-latest
    needs: [create-release, create-tag]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained (Windows)
        run: |
          dotnet publish Clandom/Clandom.csproj `
            -c Release -r win-x64 --self-contained true `
            -o publish/win-x64/self-contained
      - name: Create ZIP archive
        run: |
          Compress-Archive -Path publish/win-x64/self-contained/* -DestinationPath Clandom-${{ needs.create-tag.outputs.version_name }}-Windows-x64.zip
      - name: Upload ZIP
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-${{ needs.create-tag.outputs.version_name }}-Windows-x64.zip
          asset_name: Clandom-${{ needs.create-tag.outputs.version_name }}-Windows-x64.zip
          asset_content_type: application/zip
