name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  # 创建 Git 标签
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, will reuse it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  # 创建 GitHub Release（草稿）
  create-release:
    runs-on: ubuntu-latest
    needs: create-tag
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.create-tag.outputs.tag_name }}
          name: Release ${{ needs.create-tag.outputs.tag_name }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux 构建（仅自包含）
  build-linux:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dotnet-deb tool
        run: dotnet tool install -g dotnet-deb
      - name: Install appimagetool
        run: |
          wget -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
      - name: Publish self-contained (Linux)
        run: |
          dotnet publish Clandom/Clandom.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o publish/linux-x64/self-contained
      - name: Build .deb package
        run: |
          dotnet deb Clandom/Clandom.csproj -c Release -r linux-x64 -p:SelfContained=true -o ./deb
          mv ./deb/*.deb ./Clandom-Linux-x64.deb
      - name: Build AppImage package
        run: |
          appdir="AppDir"
          mkdir -p $appdir/usr/bin
          cp -r publish/linux-x64/self-contained/* $appdir/usr/bin/
          printf '[Desktop Entry]\nName=Clandom\nComment=Avalonia Application\nExec=Clandom\nIcon=Clandom\nTerminal=false\nType=Application\nCategories=Utility;\n' > $appdir/Clandom.desktop
          printf '#!/bin/bash\nSELF=$(readlink -f "$0")\nHERE=$(dirname "$SELF")\nexec "$HERE/usr/bin/Clandom" "$@"\n' > $appdir/AppRun
          chmod +x $appdir/AppRun
          appimagetool $appdir Clandom-Linux-x64.AppImage
          rm -rf $appdir
      - name: Upload .deb
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-Linux-x64.deb
          asset_name: Clandom-Linux-x64.deb
          asset_content_type: application/vnd.debian.binary-package
      - name: Upload .AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-Linux-x64.AppImage
          asset_name: Clandom-Linux-x64.AppImage
          asset_content_type: application/x-executable

  # macOS 构建（两种模式）
  build-macos:
    runs-on: macos-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained (macOS)
        run: |
          dotnet publish Clandom/Clandom.csproj \
            -c Release -r osx-x64 --self-contained true \
            -o publish/osx-x64/self-contained
      - name: Publish framework-dependent (macOS)
        run: |
          dotnet publish Clandom/Clandom.csproj \
            -c Release -r osx-x64 --self-contained false \
            -o publish/osx-x64/framework-dependent
      - name: Build .pkg packages
        run: |
          build_pkg() {
            local source_dir=$1
            local output_name=$2
            local app_name="Clandom.app"
            mkdir -p $app_name/Contents/MacOS
            cp -r $source_dir/* $app_name/Contents/MacOS/
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n    <key>CFBundleExecutable</key>\n    <string>Clandom</string>\n    <key>CFBundleIdentifier</key>\n    <string>com.yourcompany.clandom</string>\n    <key>CFBundleName</key>\n    <string>Clandom</string>\n    <key>CFBundleVersion</key>\n    <string>1.0</string>\n</dict>\n</plist>\n' > $app_name/Contents/Info.plist
            pkgbuild --root $app_name --identifier com.yourcompany.clandom --version 1.0 $output_name
            rm -rf $app_name
          }
          build_pkg "publish/osx-x64/self-contained" "Clandom-macOS-x64-SelfContained.pkg"
          build_pkg "publish/osx-x64/framework-dependent" "Clandom-macOS-x64-FrameworkDependent.pkg"
      - name: Upload .pkg (self-contained)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-macOS-x64-SelfContained.pkg
          asset_name: Clandom-macOS-x64-SelfContained.pkg
          asset_content_type: application/x-newton-compatible-pkg
      - name: Upload .pkg (framework-dependent)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-macOS-x64-FrameworkDependent.pkg
          asset_name: Clandom-macOS-x64-FrameworkDependent.pkg
          asset_content_type: application/x-newton-compatible-pkg

  # Windows 构建（自包含 ZIP）
  build-windows:
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained (Windows)
        run: |
          dotnet publish Clandom/Clandom.csproj `
            -c Release -r win-x64 --self-contained true `
            -o publish/win-x64/self-contained
      - name: Create ZIP archive
        run: |
          Compress-Archive -Path publish/win-x64/self-contained/* -DestinationPath Clandom-Windows-x64.zip
      - name: Upload ZIP
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./Clandom-Windows-x64.zip
          asset_name: Clandom-Windows-x64.zip
          asset_content_type: application/zip
